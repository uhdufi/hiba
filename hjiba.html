<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hiba Amari</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ffd6e7, #e7d7ff);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333;
    }

    .card {
      width: 90%;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.9);
      padding: 45px 30px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    }

    .avatar {
      width: 110px;
      height: 110px;
      margin: auto;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff8fbc, #9d7cff);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 45px;
      color: white;
      font-weight: bold;
    }

    h1 {
      margin-top: 20px;
      font-size: 36px;
      color: #8b4d8f;
    }

    .subtitle {
      margin-top: 10px;
      color: #777;
      font-size: 16px;
    }

    .message {
      margin: 25px 0;
      line-height: 1.7;
      font-size: 17px;
    }

    .button {
      display: inline-block;
      padding: 13px 28px;
      border-radius: 30px;
      background: #9d6cff;
      color: white;
      text-decoration: none;
      transition: 0.3s;
    }

    .button:hover {
      background: #7c4de0;
      transform: translateY(-3px);
    }

    .footer {
      margin-top: 30px;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="avatar">
      H
    </div>

    <h1>Hiba Amari</h1>

    <p class="subtitle">
      Welcome to Hiba's little corner ✨
    </p>

    <p class="message">
      A simple website made especially for Hiba.
      <br>
      Keep smiling, keep dreaming, and keep being yourself. 💗
    </p>

    <a href="#" class="button">
      ✨ Discover
    </a>

    <p class="footer">
      Made with ❤️ for Hiba Amari
    </p>

  </div>

</body>
</html>
